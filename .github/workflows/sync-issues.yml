name: Sincronizar Issues e Labels

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Criar Labels e Issues no Repositório
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Instalar Python
        run: uv python install 3.14

      - name: Executar sincronização de issues e labels
        run: uv run python scripts/create_issues.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
