[project]
name = "pyne2027"
version = "0.1.0"
description = "Site da Python Nordeste 2027"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
]

[project.optional-dependencies]
dev = [
    "livereload>=2.7.1",
    "pytest",
    "ruff",
]

[project.scripts]
main = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

[tool.uv.sources]
livereload = { git = "https://github.com/HigorMonteiro/python-livereload", branch = "master" }

[dependency-groups]
dev = [
    "livereload",
]

